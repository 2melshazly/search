<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2M ElSHAZLY - تجهيز طلب الألعاب</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; }

        body {
            font-family: 'Cairo', Tahoma, Arial, sans-serif;
            background: #0b1120;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #111827; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #f97316; }

        .print-only { display: none; }

        /* شكل الورقة داخل الموقع */
        .receipt-preview {
            width: 100%;
            max-width: none;
            margin: 0;
            padding: 0;
            background: #fff;
            color: #000;
            border-radius: 0;
            box-shadow: none;
        }

        .receipt-header {
            text-align: center;
            border-bottom: 2px dashed #000;
            padding-bottom: 8px;
            margin-bottom: 10px;
        }

        .store-name {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: .5px;
            color: #000;
        }

        .receipt-title {
            font-size: 14px;
            font-weight: 800;
            margin-top: 2px;
            color: #000;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px 10px;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 10px;
            color: #000;
        }

        .info-item {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .info-item.full {
            grid-column: 1 / -1;
        }

        .phone-input {
            border: 0;
            border-bottom: 1px dashed #000;
            outline: 0;
            width: 160px;
            background: transparent;
            font-family: inherit;
            font-size: 13px;
            font-weight: 800;
            text-align: right;
            color: #000;
        }

        .games-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            color: #000;
        }

        .games-table th,
        .games-table td {
            border-bottom: 1px solid #000;
            padding: 6px 2px;
            vertical-align: middle;
        }

        .games-table th {
            font-weight: 900;
            background: #f3f4f6;
            color: #000;
            border-top: 1px solid #000;
        }

        .games-table .game-name {
            text-align: right;
            font-weight: 800;
            width: 60%;
        }

        .games-table .disk {
            text-align: center;
            font-weight: 900;
            white-space: nowrap;
            width: 28%;
        }

        .games-table .index {
            width: 12%;
            text-align: center;
            font-weight: 800;
        }

        .totals {
            border-top: 2px dashed #000;
            margin-top: 8px;
            padding-top: 6px;
            font-size: 13px;
            font-weight: 800;
            color: #000;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin: 3px 0;
        }

        .grand-total {
            font-size: 16px;
            font-weight: 900;
            margin-top: 4px;
        }

        .receipt-footer {
            border-top: 2px dashed #000;
            margin-top: 10px;
            padding-top: 8px;
            text-align: center;
            font-size: 11px;
            font-weight: 800;
            color: #000;
        }

        /* منع أي انكماش إضافي من الحاويات أثناء المعاينة والطباعة */
        #printReceipt,
        #printReceipt .receipt-preview,
        #printReceipt .games-table,
        #printReceipt .info-grid,
        #printReceipt .totals,
        #printReceipt .receipt-footer {
            box-sizing: border-box;
        }

        #printReceipt .games-table .game-name {
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        /* =========================================================
           طباعة حرارية 80mm
           ========================================================= */
        @media print {
            @page {
                size: 80mm auto;
                margin: 0;
            }

            html,
            body {
                width: 80mm !important;
                min-width: 80mm !important;
                max-width: 80mm !important;
                margin: 0 !important;
                padding: 0 !important;
                background: #fff !important;
                color: #000 !important;
                overflow: visible !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            body {
                font-family: 'Cairo', Tahoma, Arial, sans-serif !important;
            }

            body * {
                visibility: hidden !important;
            }

            #printReceipt,
            #printReceipt * {
                visibility: visible !important;
            }

            #printReceipt {
                display: block !important;
                position: absolute !important;
                left: 0 !important;
                right: auto !important;
                top: 0 !important;
                width: 80mm !important;
                min-width: 80mm !important;
                max-width: 80mm !important;
                margin: 0 !important;
                /* زيادة مسافة الأمان العلوية لـ 16mm لضمان ظهور الاسم كاملاً */
                padding: 16mm 0 0 0 !important;
                background: #fff !important;
                color: #000 !important;
                box-shadow: none !important;
                overflow: visible !important;
            }

            #printReceipt .receipt-preview {
                display: block !important;
                width: 80mm !important;
                min-width: 80mm !important;
                max-width: 80mm !important;
                margin: 0 !important;
                padding: 0 !important;
                background: #fff !important;
                color: #000 !important;
                border: 0 !important;
                border-radius: 0 !important;
                box-shadow: none !important;
                overflow: visible !important;
            }

            #printReceipt .receipt-header {
                width: 100% !important;
                margin: 0 0 3mm 0 !important;
                padding: 0 0 2mm 0 !important;
                border-bottom: 2px dashed #000 !important;
            }

            #printReceipt .store-name {
                font-size: 25px !important;
                line-height: 1.2 !important;
                font-weight: 900 !important;
            }

            #printReceipt .receipt-title {
                font-size: 16px !important;
                line-height: 1.3 !important;
                font-weight: 900 !important;
                margin-top: 2px !important;
            }

            #printReceipt .info-grid {
                width: 100% !important;
                margin: 0 0 3mm 0 !important;
                padding: 0 !important;
                gap: 2mm 3mm !important;
                font-size: 15px !important;
                line-height: 1.45 !important;
                font-weight: 800 !important;
            }

            #printReceipt .info-item {
                min-width: 0 !important;
                gap: 3px !important;
                font-weight: 800 !important;
                overflow-wrap: anywhere !important;
            }

            #printReceipt .phone-input {
                width: 100% !important;
                max-width: 100% !important;
                min-width: 0 !important;
                padding: 0 !important;
                margin: 0 !important;
                border: 0 !important;
                border-bottom: 1px solid #000 !important;
                border-radius: 0 !important;
                font-family: inherit !important;
                font-size: 15px !important;
                font-weight: 900 !important;
                background: transparent !important;
                color: #000 !important;
            }

            #printReceipt .games-table {
                display: table !important;
                width: 100% !important;
                min-width: 100% !important;
                max-width: 100% !important;
                table-layout: fixed !important;
                border-collapse: collapse !important;
                margin: 0 !important;
                padding: 0 !important;
                font-size: 14px !important;
                line-height: 1.35 !important;
                font-weight: 800 !important;
            }

            #printReceipt .games-table th,
            #printReceipt .games-table td {
                padding: 2mm 1mm !important;
                margin: 0 !important;
                border-bottom: 1px solid #000 !important;
                vertical-align: middle !important;
                overflow-wrap: anywhere !important;
                word-break: break-word !important;
                white-space: normal !important;
                color: #000 !important;
            }

            #printReceipt .games-table th {
                font-size: 14px !important;
                font-weight: 900 !important;
                border-top: 1px solid #000 !important;
            }

            #printReceipt .games-table .index {
                width: 10% !important;
                text-align: center !important;
                font-weight: 900 !important;
                white-space: nowrap !important;
            }

            #printReceipt .games-table .game-name {
                width: 62% !important;
                min-width: 0 !important;
                text-align: right !important;
                font-weight: 900 !important;
                white-space: normal !important;
                overflow-wrap: anywhere !important;
                word-break: break-word !important;
            }

            #printReceipt .games-table .disk {
                width: 28% !important;
                text-align: center !important;
                font-weight: 900 !important;
                white-space: normal !important;
                overflow-wrap: anywhere !important;
            }

            #printReceipt .totals {
                width: 100% !important;
                margin: 3mm 0 0 0 !important;
                padding: 2mm 0 0 0 !important;
                border-top: 2px dashed #000 !important;
                font-size: 15px !important;
                line-height: 1.45 !important;
                font-weight: 900 !important;
            }

            #printReceipt .total-row {
                width: 100% !important;
                margin: 1mm 0 !important;
                padding: 0 !important;
                gap: 4mm !important;
                font-weight: 900 !important;
            }

            #printReceipt .grand-total {
                font-size: 18px !important;
                font-weight: 900 !important;
                margin-top: 2mm !important;
            }

            #printReceipt .receipt-footer {
                width: 100% !important;
                margin: 3mm 0 0 0 !important;
                padding: 2mm 0 0 0 !important;
                border-top: 2px dashed #000 !important;
                text-align: center !important;
                font-size: 13px !important;
                line-height: 1.45 !important;
                font-weight: 900 !important;
            }
        }
    </style>
</head>

<body class="text-white min-h-screen p-4 md:p-8">

<div class="max-w-6xl mx-auto">

    <div class="text-center mb-7">
        <div class="text-3xl font-extrabold text-orange-500">2M ElSHAZLY</div>
        <div class="text-gray-400 mt-1">تجهيز وطباعة طلب ألعاب العميل</div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

        <!-- إدخال الطلب -->
        <div class="bg-gray-800 p-5 md:p-6 rounded-2xl border border-gray-700 shadow-2xl">
            <h2 class="text-lg font-bold mb-4">
                📝 لصق رسالة العميل
            </h2>

            <textarea
                id="clientMessage"
                rows="12"
                placeholder="انسخ رسالة الواتساب هنا..."
                class="w-full bg-gray-900 border border-gray-600 rounded-xl p-4 text-sm text-white focus:border-orange-500 outline-none transition"
            ></textarea>

            <button
                onclick="processOrder()"
                class="w-full mt-4 bg-orange-600 hover:bg-orange-700 text-white font-bold py-3 rounded-xl transition shadow-lg"
            >
                استخراج الطلب وتجهيز الورقة 🚀
            </button>

            <div id="sheetStatus" class="text-sm text-gray-400 mt-3 text-center">
                جاري تحميل بيانات الألعاب من Google Sheet...
            </div>

            <div class="mt-6 border-t border-gray-700 pt-5">
                <h3 class="font-bold mb-3">📞 رقم موبايل العميل</h3>
                <input
                    id="phoneNumber"
                    type="text"
                    inputmode="tel"
                    placeholder="اكتب رقم الموبايل هنا قبل الطباعة"
                    class="w-full bg-gray-900 border border-gray-600 rounded-xl p-3 text-white outline-none focus:border-orange-500"
                >
            </div>

            <div class="mt-4">
                <button
                    onclick="printReceipt()"
                    id="printButton"
                    disabled
                    class="w-full bg-green-600 hover:bg-green-700 disabled:bg-gray-600 disabled:cursor-not-allowed text-white font-bold py-3 rounded-xl transition"
                >
                    🖨️ طباعة الطلب
                </button>
            </div>
        </div>

        <!-- المعاينة -->
        <div class="bg-gray-800 p-5 rounded-2xl border border-gray-700 shadow-2xl">
            <h2 class="text-lg font-bold mb-4">
                🧾 معاينة ورقة الطباعة
            </h2>

            <div id="emptyState" class="text-center py-16 text-gray-500 border-2 border-dashed border-gray-700 rounded-xl">
                الصق رسالة العميل ثم اضغط<br>
                <b class="text-orange-400">استخراج الطلب وتجهيز الورقة</b>
            </div>

            <div id="previewContainer" class="hidden">
                <div id="receiptPreview" class="receipt-preview"></div>
            </div>
        </div>

    </div>

    <!-- البحث السريع -->
    <div class="mt-6 bg-gray-800 p-5 rounded-2xl border border-gray-700 shadow-2xl">
        <h2 class="font-bold mb-3">🔎 بحث سريع عن لعبة</h2>
        <input
            id="quickSearch"
            type="text"
            placeholder="اكتب اسم اللعبة..."
            class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-right focus:border-blue-500 outline-none"
        >
        <div id="quickResults" class="mt-3 space-y-2"></div>
    </div>

</div>

<!-- النسخة التي ستظهر للطباعة فقط -->
<div id="printReceipt" class="print-only"></div>

<script>
    const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRk9tF0tSMmaPWHfubselfqGO1bpDlOzgq0go1RU2BSI43BaHoaLGjHOHKjYyGA-ywytXmKvQETVJOF/pub?output=csv';

    let gamesData = [];
    let currentOrder = null;

    // =========================
    // أدوات تنظيف النص
    // =========================
    function normalizeArabic(text) {
        return String(text || '')
            .toLowerCase()
            .replace(/[أإآ]/g, 'ا')
            .replace(/ة/g, 'ه')
            .replace(/ى/g, 'ي')
            .replace(/ؤ/g, 'و')
            .replace(/ئ/g, 'ي')
            .replace(/[ًٌٍَُِّْـ]/g, '')
            .replace(/\s+/g, ' ')
            .trim();
    }

    function escapeHTML(text) {
        return String(text ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    // =========================
    // تحميل Google Sheet
    // =========================
    Papa.parse(sheetUrl, {
        download: true,
        header: false,
        skipEmptyLines: true,

        complete: function(results) {
            const rows = results.data.slice(1);

            gamesData = rows.map(r => ({
                name: r[0] ? String(r[0]).trim() : '',
                normalized: normalizeArabic(r[0]),
                displayName: r[0] ? String(r[0]).trim() : '',
                number: r[1] ? String(r[1]).trim() : 'غير محدد',
                notes: r[2] ? String(r[2]).trim() : ''
            })).filter(g => g.normalized.length > 1);

            document.getElementById('sheetStatus').innerHTML =
                `✅ تم تحميل <b>${gamesData.length}</b> لعبة من الشيت`;

            console.log('Sheet Loaded:', gamesData.length);
        },

        error: function(error) {
            document.getElementById('sheetStatus').innerHTML =
                '❌ حدثت مشكلة في تحميل Google Sheet';
            console.error(error);
        }
    });

    // =========================
    // استخراج بيانات الرسالة
    // =========================
    function parseCustomerMessage(message) {

        const lines = message
            .split(/\r?\n/)
            .map(x => x.trim())
            .filter(Boolean);

        let customerName = '';
        let branch = '';
        let gameCount = '';
        let total = '';

        const nameMatch = message.match(/أنا\s+(.+?)(?:\r?\n|$)/i);
        if (nameMatch) {
            customerName = nameMatch[1].trim();
        }

        const branchMatch = message.match(/الفرع\s*:\s*(.+)/i);
        if (branchMatch) {
            branch = branchMatch[1].trim();
        }

        const countMatch = message.match(/عدد\s+الألعاب\s*:\s*(\d+)/i);
        if (countMatch) {
            gameCount = countMatch[1];
        }

        const totalMatch = message.match(/الإجمالي\s*:\s*([\d.,]+)\s*(?:ج\.م|جنيه)?/i);
        if (totalMatch) {
            total = totalMatch[1] + ' ج.م';
        }

        return {
            customerName,
            branch,
            gameCount,
            total,
            lines
        };
    }

    // =========================
    // إيجاد اللعبة في الشيت
    // =========================
    function findGame(line) {
        let clean = line
            .replace(/^\s*\d+\s*[\.\-\)]\s*/, '')
            .trim();

        if (clean.length < 3) return null;

        const normalizedLine = normalizeArabic(clean);

        let match = gamesData.find(g =>
            normalizedLine === g.normalized ||
            normalizedLine.includes(g.normalized) ||
            g.normalized.includes(normalizedLine)
        );

        if (!match) {
            const words = normalizedLine
                .split(' ')
                .filter(w => w.length >= 3);

            match = gamesData.find(g => {
                const gameWords = g.normalized.split(' ').filter(w => w.length >= 3);
                const found = words.filter(w => gameWords.some(gw => gw.includes(w) || w.includes(gw)));
                return words.length >= 2 && found.length >= Math.min(2, words.length);
            });
        }

        return match || null;
    }

    // =========================
    // معالجة الطلب
    // =========================
    function processOrder() {

        const message = document.getElementById('clientMessage').value.trim();

        if (!message) {
            alert('انسخ رسالة العميل أولاً.');
            return;
        }

        if (!gamesData.length) {
            alert('بيانات الألعاب لم تكتمل من Google Sheet بعد. انتظر ثواني وحاول مرة أخرى.');
            return;
        }

        const info = parseCustomerMessage(message);
        const games = [];

        info.lines.forEach(line => {
            const match = findGame(line);

            if (match) {
                games.push({
                    displayName: match.displayName,
                    number: match.number,
                    notes: match.notes
                });
            }
        });

        if (!games.length) {
            alert('لم أستطع التعرف على الألعاب. تأكد أن أسماء الألعاب موجودة في Google Sheet.');
            return;
        }

        currentOrder = {
            customerName: info.customerName || 'غير محدد',
            branch: info.branch || 'غير محدد',
            gameCount: info.gameCount || String(games.length),
            total: info.total || 'غير محدد',
            games: games
        };

        renderReceipt(currentOrder);

        document.getElementById('emptyState').classList.add('hidden');
        document.getElementById('previewContainer').classList.remove('hidden');
        document.getElementById('printButton').disabled = false;
    }

    // =========================
    // بناء الورقة
    // =========================
    function receiptHTML(order) {

        const phone = document.getElementById('phoneNumber').value.trim();

        const rows = order.games.map((game, index) => `
            <tr>
                <td class="index">${index + 1}</td>
                <td class="game-name">${escapeHTML(game.displayName)}</td>
                <td class="disk">${escapeHTML(game.number)}</td>
            </tr>
        `).join('');

        return `
            <div class="receipt-preview">

                <div class="receipt-header">
                    <div class="store-name">2M ElSHAZLY</div>
                    <div class="receipt-title">طلب تجهيز ألعاب بلايستيشن</div>
                </div>

                <div class="info-grid">
                    <div class="info-item full">
                        <b>العميل:</b>
                        <span>${escapeHTML(order.customerName)}</span>
                    </div>

                    <div class="info-item">
                        <b>الفرع:</b>
                        <span>${escapeHTML(order.branch)}</span>
                    </div>

                    <div class="info-item">
                        <b>عدد الألعاب:</b>
                        <span>${escapeHTML(order.gameCount)}</span>
                    </div>

                    <div class="info-item full">
                        <b>الموبايل:</b>
                        <input
                            class="phone-input"
                            value="${escapeHTML(phone)}"
                            placeholder="........................"
                            oninput="syncPhone(this.value)"
                        >
                    </div>
                </div>

                <table class="games-table">
                    <thead>
                        <tr>
                            <th class="index">#</th>
                            <th class="game-name">اسم اللعبة</th>
                            <th class="disk">الهارد</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${rows}
                    </tbody>
                </table>

                <div class="totals">
                    <div class="total-row">
                        <span>عدد الألعاب</span>
                        <b>${escapeHTML(order.gameCount)}</b>
                    </div>

                    <div class="total-row grand-total">
                        <span>الإجمالي</span>
                        <span>${escapeHTML(order.total)}</span>
                    </div>
                </div>

                <div class="receipt-footer">
                    2M ElSHAZLY<br>
                    شكراً لتعاملكم معنا
                </div>

            </div>
        `;
    }

    function renderReceipt(order) {
        document.getElementById('receiptPreview').innerHTML = receiptHTML(order);
        document.getElementById('printReceipt').innerHTML = receiptHTML(order);
    }

    function syncPhone(value) {
        document.getElementById('phoneNumber').value = value;

        if (currentOrder) {
            renderReceipt(currentOrder);
        }
    }

    document.getElementById('phoneNumber').addEventListener('input', function() {
        if (currentOrder) {
            renderReceipt(currentOrder);
        }
    });

    // =========================
    // الطباعة
    // =========================
    function printReceipt() {

        if (!currentOrder) {
            alert('جهز الطلب أولاً.');
            return;
        }

        renderReceipt(currentOrder);

        setTimeout(() => {
            window.print();
        }, 150);
    }

    // =========================
    // البحث السريع
    // =========================
    document.getElementById('quickSearch').addEventListener('input', function(e) {

        const q = normalizeArabic(e.target.value);
        const box = document.getElementById('quickResults');

        box.innerHTML = '';

        if (!q) return;

        const filtered = gamesData
            .filter(g => g.normalized.includes(q))
            .slice(0, 10);

        if (!filtered.length) {
            box.innerHTML = '<div class="text-gray-500 text-sm">لا توجد نتائج.</div>';
            return;
        }

        filtered.forEach(game => {
            const div = document.createElement('div');

            div.className =
                'bg-gray-900 border border-gray-700 rounded-xl p-3 flex items-center justify-between gap-3';

            div.innerHTML = `
                <span class="font-bold text-blue-400">
                    هارد ${escapeHTML(game.number)}
                </span>
                <span class="text-sm text-right flex-1">
                    ${escapeHTML(game.displayName)}
                </span>
            `;

            box.appendChild(div);
        });
    });
</script>

</body>
    </html>
